<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لمّة العائلة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="لعبة أسئلة عائلية بالعربية تلعبها الفرق على شاشة واحدة، مع بطاقات قوة مثل الوقت الإضافي والنقاط المضاعفة والكذبة.">
<meta name="theme-color" content="#4a5159">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="stage" dir="rtl" lang="ar">
  <main class="card" id="card">
    <div class="backdrop" aria-hidden="true"><div class="orb"></div></div>

    <header class="top">
      <button class="burger" type="button" id="burger" data-act="menu" aria-label="القائمة" aria-expanded="false" aria-controls="menu"><i></i></button>
      <div class="logo" aria-label="لمّة">
        <span>لَمّة</span>
        <svg class="logo-mark" viewBox="0 0 24 16" aria-hidden="true">
          <circle cx="5" cy="7.5" r="2.4" fill="currentColor"/>
          <circle cx="12" cy="4" r="2.4" fill="currentColor"/>
          <circle cx="19" cy="7.5" r="2.4" fill="currentColor"/>
          <path d="M3.5 13.5c5-3.2 12-3.2 17 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <button class="toplink" type="button" data-act="rules">طريقة اللعب</button>
    </header>

    <div class="scores" id="scores" hidden></div>

    <section class="view" id="view" aria-live="polite"></section>

    <footer class="foot">
      <button class="back" type="button" id="back"></button>
      <div class="halo" id="halo">
        <svg class="ring" id="ring" viewBox="0 0 160 160" aria-hidden="true">
          <circle class="ring-track" cx="80" cy="80" r="70"/>
          <circle class="ring-fill" id="ringFill" cx="80" cy="80" r="70" pathLength="100"/>
        </svg>
        <button class="go" type="button" id="go" aria-label="التالي">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5 12 15l5.5-5.5"/></svg>
        </button>
        <span class="go-label" id="goLabel"></span>
      </div>
      <div class="clock" id="clock" aria-live="off"></div>
    </footer>

    <div class="progress" aria-hidden="true"><span id="bar"></span></div>

    <div class="menu" id="menu" role="menu" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <button class="sheet-x" type="button" data-act="close" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="sheet-panel" id="sheetBody"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</div>
<script src="assets/questions.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
